services:
  postgres:
    image: postgres:17
    container_name: campus_hustle_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus_hustle
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus_password
    ports:
      - "5432:5432"
    volumes:
      - campus_hustle_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_hustle"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: campus_hustle_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - campus_hustle_redisdata:/data

volumes:
  campus_hustle_pgdata:
  campus_hustle_redisdata:
